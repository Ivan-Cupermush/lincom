<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lincom</title>
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region>
      <span data-tauri-drag-region>◆ lincom — link manager</span>
      <span id="win-controls">
        <button id="btn-min" title="Minimize">─</button>
        <button id="btn-close" title="Close">✕</button>
      </span>
    </div>

    <div id="screen">
      <div id="panels">
        <pre id="left"></pre>
        <div id="right"></div>
      </div>
      <div id="cmdline"></div>
      <div id="hotkeys"><span class="k">C-N</span> Add <span class="k">C-S-N</span> Mkdir <span class="k">C-R</span> Edit <span class="k">Enter</span> Open <span class="k">Del</span> Delete <span class="k">C-S-T</span> Theme <span class="k">Esc</span> Back <span class="k">C-Q</span> Quit</div>
    </div>

    <input id="kbd" autocomplete="off" spellcheck="false" />
    <span id="probe">MMMMMMMMMM</span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
